<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Skinz ist eine Golf Skins App für Live Scoring, Flights, Scorecards und Season Leaderboards."
    />
    <meta name="theme-color" content="#e8ebe5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skinz" />
    <meta name="application-name" content="Skinz" />
    <meta name="msapplication-TileColor" content="#071819" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Skinz – Golf Skins Live Scoring" />
    <meta
      property="og:description"
      content="Golf Skins Live Scoring, Flights, Scorecards und Season Leaderboards."
    />
    <meta property="og:site_name" content="Skinz" />
    <meta property="og:locale" content="de_DE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Hell/Dunkel vor dem ersten Rendern setzen, damit nichts aufblitzt.
      // Die gleiche Logik steckt in src/utils/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem("skinz-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Skinz – Golf Skins Live Scoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
